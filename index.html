<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitVerse - Active Workspace</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #110f1a;
    }
    #ui-overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
  <!-- Injeção direta e estável do motor tridimensional CDN -->
  <script src="https://cloudflare.com"></script>
  <!-- Injeção segura do pipeline de sockets clientes -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="ui-overlay-container"></div>
  <script src="public/main.js"></script>
</body>
</html>
